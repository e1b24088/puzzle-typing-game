services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
      - ranking_data:/data
    environment:
      RANKING_DATABASE_URL: jdbc:h2:file:/data/results;DB_CLOSE_ON_EXIT=FALSE

volumes:
  frontend_node_modules:
  maven_cache:
  ranking_data:
